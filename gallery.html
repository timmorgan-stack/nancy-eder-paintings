<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — Nancy Eder</title>
  <meta name="description" content="Browse original ink and watercolour paintings by Nancy Eder. Filter by series and availability; every work is available to purchase online.">
  <link rel="icon" href="img/site/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="gallery">
  <div data-region="header"></div>

  <main data-region="main">
    <section class="section section--tight" data-hook="gallery">
      <div class="wrap">
        <div class="section-head" style="margin-bottom:24px">
          <div>
            <div class="eyebrow">Gallery</div>
            <h1 style="margin:0">Work</h1>
          </div>
          <p class="lede" style="margin:0;max-width:44ch;font-size:1rem">Click any painting to open it large; use the arrow keys or swipe to move through the set. Click the enlarged image once more to zoom in.</p>
        </div>

        <div class="filters" role="toolbar" aria-label="Filter works" data-hook="gallery-filters">
          <div data-series-chips></div>
          <div class="spacer"></div>
          <select data-status aria-label="Availability">
            <option value="all">All works</option>
            <option value="available">Available</option>
            <option value="sold">Sold</option>
          </select>
          <select data-sort aria-label="Sort">
            <option value="default">Featured first</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="newest">Newest</option>
          </select>
        </div>
        <div class="result-count" data-count aria-live="polite" style="margin-bottom:20px"></div>

        <div class="grid" data-grid></div>
        <div class="empty" data-empty hidden>No works match those filters. <a class="link" href="gallery.html">Show everything</a></div>
      </div>
    </section>
  </main>

  <div data-region="footer"></div>

  <script src="data/catalog.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lightbox.js"></script>
  <script>
    (async () => {
      const cat = await NE.loadCatalog();
      const chips = document.querySelector('[data-series-chips]');
      const statusSel = document.querySelector('[data-status]');
      const sortSel = document.querySelector('[data-sort]');
      const grid = document.querySelector('[data-grid]');
      const count = document.querySelector('[data-count]');
      const empty = document.querySelector('[data-empty]');

      const state = {
        series: NE.qs('series') || 'all',
        status: NE.qs('status') || 'all',
        sort: NE.qs('sort') || 'default'
      };
      statusSel.value = state.status; sortSel.value = state.sort;

      chips.innerHTML = [{ id: 'all', name: 'All' }, ...cat.series]
        .map(s => `<button class="chip" data-series="${s.id}" aria-pressed="${state.series === s.id}">${s.name}</button>`).join('');
      chips.style.display = 'contents';

      let current = [];
      function apply() {
        let list = cat.artworks.filter(a =>
          (state.series === 'all' || a.series === state.series) &&
          (state.status === 'all' || a.status === state.status));
        if (state.sort === 'price-asc') list.sort((a, b) => a.price - b.price);
        else if (state.sort === 'price-desc') list.sort((a, b) => b.price - a.price);
        else if (state.sort === 'newest') list.sort((a, b) => (b.year - a.year) || (Number(b.id) - Number(a.id)));
        else list.sort((a, b) => (b.featured - a.featured));

        current = list;
        grid.innerHTML = list.map(a => NE.cardHTML(a)).join('');
        NE.lightbox.setItems(list);
        NE.watchGrid(grid);
        count.textContent = `${list.length} ${list.length === 1 ? 'work' : 'works'}`;
        empty.hidden = list.length > 0;
        NE.setQs(state);
        chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.series === state.series));
      }

      chips.addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (!c) return; state.series = c.dataset.series; apply(); });
      statusSel.addEventListener('change', () => { state.status = statusSel.value; apply(); });
      sortSel.addEventListener('change', () => { state.sort = sortSel.value; apply(); });
      apply();

      // Deep link: gallery.html?view=<id> opens the lightbox on that work
      const view = NE.qs('view');
      if (view) { const i = current.findIndex(a => a.id === view); if (i > -1) NE.lightbox.open(current, i); }
    })();
  </script>
</body>
</html>
