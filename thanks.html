<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you — Nancy Eder</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/site/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="thanks">
  <div data-region="header"></div>

  <main data-region="main">
    <section class="wrap thanks" data-hook="order-confirmation">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
      <div class="eyebrow">Order received</div>
      <h1>Thank you, <span data-name>collector</span>.</h1>
      <p class="lede" style="margin:0 auto 24px">Your painting is now yours. A receipt has been sent to <strong data-email>your email</strong>, and you'll get a tracking number when it ships — usually within five working days.</p>
      <p class="order-no">Order <span data-order-id>—</span></p>
      <ul class="mini-lines" data-lines style="text-align:left;margin:28px auto;max-width:440px"></ul>
      <p class="muted" data-total></p>
      <div class="hero__actions" style="justify-content:center;margin-top:28px">
        <a class="btn" href="gallery.html">Keep browsing</a>
        <a class="btn btn--ghost" href="index.html">Back to home</a>
      </div>
    </section>
  </main>

  <div data-region="footer"></div>

  <script src="data/catalog.js"></script>
  <script src="js/app.js"></script>
  <script>
    (() => {
      let o = null;
      try { o = JSON.parse(sessionStorage.getItem('ne_last_order')); } catch {}
      if (!o) return;
      const $ = (s) => document.querySelector(s);
      $('[data-name]').textContent = o.customer.firstName || 'collector';
      $('[data-email]').textContent = o.customer.email || 'your email';
      $('[data-order-id]').textContent = o.id;
      $('[data-lines]').innerHTML = o.items.map(i => { return `<li><span class="grow">${i.title}</span><span>${NE.money(i.price)}</span></li>`; }).join('');
      const total = o.subtotal + (o.shipping || 0);
      $('[data-total]').textContent = `Total ${NE.money(total)}${o.shipping == null ? ' plus international shipping (quoted separately)' : ' including shipping'}.`;
    })();
  </script>
</body>
</html>
